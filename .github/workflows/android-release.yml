name: Android checks and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Rebuild an existing tag and publish its APK if missing (optional)'
        type: string
        required: false
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Android checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.release_source.outputs.source_sha }}
      tag_object_sha: ${{ steps.release_source.outputs.tag_object_sha }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          # 版本门禁要读全部 v* tag 里的 versionCode 历史，必须完整克隆。
          fetch-depth: 0

      - name: Check versionCode monotonicity
        id: release_source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          workflow_source="$RUNNER_TEMP/android-workflow"
          mkdir -p "$workflow_source"
          app_source="app/src/main/java/com/hnwd/bdplayer"
          git archive "$GITHUB_WORKFLOW_SHA" .github/scripts \
            "$app_source/QuarkDriveActivity.kt" "$app_source/QuarkLoginLogic.kt" | tar -x -C "$workflow_source"
          scripts="$workflow_source/.github/scripts"
          source "$scripts/github-release-api.sh"
          args=(--repo "$GITHUB_WORKSPACE")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::Invalid release tag. Expected vX.Y.Z.'
              exit 1
            fi
            if lookup_github_release >/dev/null; then
              args+=(--rebuild)
            elif [[ "$?" != 4 ]]; then
              exit 1
            fi
          fi
          bash "$scripts/check-version-code.sh" "${args[@]}"
          if [[ -n "$RELEASE_TAG" ]]; then
            source_sha="$(git rev-parse --verify HEAD)"
            tag_object_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG")"
            if [[ "$(git rev-parse --verify "${tag_object_sha}^{commit}")" != "$source_sha" ]]; then
              echo "::error::Release tag $RELEASE_TAG does not point to the build commit $source_sha."
              exit 1
            fi
            printf 'source_sha=%s\ntag_object_sha=%s\n' "$source_sha" "$tag_object_sha" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test release and login regressions
        run: |
          scripts="$RUNNER_TEMP/android-workflow/.github/scripts"
          bash "$scripts/test-check-version-code.sh"
          bash "$scripts/test-publish-android-release.sh"
          node --test "$scripts/test-quark-login-hook.mjs"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Install Android SDK
        run: |
          platform="platforms;android-36.1"
          # 旧 tag 的构建文件仍声明 API 37，按其原始配置重建。
          if grep -Eq '^[[:space:]]*compileSdk[[:space:]]+37[[:space:]]*$' app/build.gradle; then
            platform="platforms;android-37.0"
          fi
          sdkmanager --channel=3 "$platform" "build-tools;35.0.0"

      - name: Run unit tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build signed Release
        if: env.RELEASE_TAG != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.BDPLAYER_KEYSTORE_BASE64 }}
          BDPLAYER_STORE_PASSWORD: ${{ secrets.BDPLAYER_STORE_PASSWORD }}
          BDPLAYER_KEY_ALIAS: ${{ secrets.BDPLAYER_KEY_ALIAS }}
          BDPLAYER_KEY_PASSWORD: ${{ secrets.BDPLAYER_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$BDPLAYER_STORE_PASSWORD" || -z "$BDPLAYER_KEY_ALIAS" || -z "$BDPLAYER_KEY_PASSWORD" ]]; then
            echo "::error::Configure all four Android signing secrets before building."
            exit 1
          fi

          umask 077
          BDPLAYER_KEYSTORE="$(mktemp "$RUNNER_TEMP/baidu-shike.XXXXXX")"
          export BDPLAYER_KEYSTORE
          trap 'rm -f -- "$BDPLAYER_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BDPLAYER_KEYSTORE"
          unset KEYSTORE_BASE64
          gradle --no-daemon :app:assembleRelease

      - name: Verify and name APK
        if: env.RELEASE_TAG != ''
        run: |
          release_dir=app/build/outputs/apk/release
          version="$(jq -er '.elements[0].versionName' "$release_dir/output-metadata.json")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::APK version is invalid."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::The Git tag must match the Android versionName (v$version)."
            exit 1
          fi

          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify "$release_dir/app-release.apk"
          mkdir -p dist
          cp "$release_dir/app-release.apk" "dist/baidu-shike-$version-release.apk"

      - uses: actions/upload-artifact@v7
        if: env.RELEASE_TAG != ''
        with:
          name: android-release-apk
          path: dist/*.apk
          if-no-files-found: error

  publish:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: android-release-apk
          path: dist

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          BUILD_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          BUILD_TAG_OBJECT_SHA: ${{ needs.build.outputs.tag_object_sha }}
        run: bash .github/scripts/publish-android-release.sh
