plugins {
    id 'com.android.application' version '8.13.1'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
}

def signingProps = new Properties()
def signingPropsFile = rootProject.file('local.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def releaseKeystore = System.getenv('BDPLAYER_KEYSTORE') ?: signingProps.getProperty('bdplayer.keystore')
def releaseStorePassword = System.getenv('BDPLAYER_STORE_PASSWORD') ?: signingProps.getProperty('bdplayer.storePassword')
def releaseKeyAlias = System.getenv('BDPLAYER_KEY_ALIAS') ?: signingProps.getProperty('bdplayer.keyAlias')
def releaseKeyPassword = System.getenv('BDPLAYER_KEY_PASSWORD') ?: signingProps.getProperty('bdplayer.keyPassword')
def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.hnwd.bdplayer'
    compileSdk 37

    defaultConfig {
        applicationId 'com.hnwd.bdplayer'
        minSdk 29
        targetSdk 35
        versionCode 24
        versionName providers.gradleProperty('bdplayerVersionName').getOrElse('0.1.23')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        buildTypes {
            release {
                minifyEnabled false
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    jvmToolchain(17)
}

android {
    testOptions {
        // 只测不碰 Android API 的纯逻辑（EntryUtils / PanApi 的构造与解析），
        // 不开 returnDefaultValues：真踩到 android.* 应当直接报错，而不是静默返回 0 / ""。
        unitTests.all {
            testLogging { events 'failed', 'skipped' }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // 单测需要真实的 org.json 实现：android.jar 里的只是 stub，调用即抛
    // 「Method ... not mocked」。production 代码用的是同一个包名，运行时仍由系统提供。
    testImplementation 'org.json:json:20240303'

    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.pdf:pdf-viewer-fragment:1.0.0-beta01'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'
}
